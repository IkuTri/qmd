[project]
name = "qmd-finetune"
version = "0.1.0"
description = "QMD query expansion fine-tuning tools"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.13.0",
  "trl>=0.12.0",
  "peft>=0.7.0",
  "transformers>=5.10.1",
  "accelerate>=1.15.0",
  "huggingface_hub>=0.20.0",
  "trackio>=0.22.0",
  "datasets>=5.0.1",
  "pyyaml",
  "gguf",
  "sentencepiece",
  "nvidia-ml-py",
  "pydantic>=2.0",
]

[dependency-groups]
dev = []

# Trackio/Gradio upper bounds currently block the Pillow 13 security fixes.
[tool.uv]
constraint-dependencies = [
  "accelerate>=1.15.0",
  "aiohttp>=3.14.4",
  "anyio>=4.14.2",
  "authlib>=1.7.1",
  "certifi>=2026.10.19",
  "cryptography>=50.0.0",
  "datasets>=5.0.1",
  "fsspec>=2026.6.0",
  "gradio>=6.16.0",
  "idna>=3.15",
  "multidict>=6.9.1",
  "pillow>=12.3.0",
  "python-multipart>=0.0.31",
  "setuptools>=83.0.0",
  "starlette>=1.3.1",
  "torch>=2.13.0",
  "transformers>=5.10.1",
  "urllib3>=2.8.0",
]
